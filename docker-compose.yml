version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/dynamicChat
      - SESSION_SECRET='thisismysessionsecret'
      - JWT_SECRET='thisisJWTsecret'
      - JWT_REFRESH_SECRET='JWTrefreshSecret'
    depends_on:
      - mongo
    volumes:
      - ./public/images:/app/public/images

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: